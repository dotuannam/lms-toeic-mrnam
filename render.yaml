services:
  - type: web
    name: toeic-lms-discord-bot
    runtime: node
    rootDir: discord-bot
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISCORD_CLIENT_ID
        value: 1565928955654181016
      - key: DISCORD_ADMIN_USER_ID
        value: 446252613160271882
      - key: DISCORD_CHANNEL_AUDIT_LOG
        value: 1565931335808188459
      - key: DISCORD_CHANNEL_DAILY_REPORTS
        value: 1565931338228437155
      - key: DISCORD_CHANNEL_ALERTS
        value: 1565931340669657209
      - key: FIREBASE_PROJECT_ID
        value: auto-lms-43b1d
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DISCORD_BOT_TOKEN
        sync: false
